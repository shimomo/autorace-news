name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: composer install --prefer-dist --no-progress
      - run: composer lint
      - run: composer analyse
      - run: composer test
      - run: node --test "tests/js/*.test.mjs"
